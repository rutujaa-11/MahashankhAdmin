{% extends "admin/base.html" %}

{% load static %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'admin/css/mahashankh.css' %}?v=11">
{% endblock %}

{% block extrahead %}
{{ block.super }}
<script src="{% static 'admin/js/mahashankh-theme.js' %}" defer></script>
{% endblock %}

{% block nav-global %}
<script>
document.addEventListener("DOMContentLoaded", function () {

    const sidebar = document.querySelector(".main-sidebar .nav-sidebar");
    if (!sidebar) return;

    sidebar.querySelectorAll(".mah-section-heading").forEach(function (e) {
        e.remove();
    });

    const allItems = Array.from(sidebar.querySelectorAll(":scope > li"));

    function getText(item) {
        return item.innerText.trim().replace(/\s+/g, " ").toLowerCase();
    }

    function findItem(searchWords) {
        for (let i = 0; i < allItems.length; i++) {
            const text = getText(allItems[i]);
            let found = searchWords.every(word => text.includes(word.toLowerCase()));
            if (found) return allItems[i];
        }
        return null;
    }

    function createHeading(title) {
        const heading = document.createElement("li");
        heading.className = "mah-section-heading";
        heading.textContent = title;
        return heading;
    }

    function insertHeadingBefore(title, item) {
        if (!item) return;
        sidebar.insertBefore(createHeading(title), item);
    }

    const dashboard = findItem(["dashboard"]);
    const countries = findItem(["countries"]);
    const wallpapers = findItem(["wallpapers"]);
    const users = findItem(["users"]);
    const aiGenerations = findItem(["ai generations"]);
    const orders = findItem(["orders"]);
    const notifications = findItem(["notifications"]);

    if (dashboard) insertHeadingBefore("MAIN", dashboard);
    if (countries) insertHeadingBefore("LOCATIONS", countries);
    if (wallpapers) insertHeadingBefore("WALLPAPERS", wallpapers);
    if (users) insertHeadingBefore("USERS", users);
    if (aiGenerations) insertHeadingBefore("AI", aiGenerations);
    if (orders) insertHeadingBefore("COMMERCE", orders);
    if (notifications) insertHeadingBefore("SYSTEM", notifications);

});
</script>
{% endblock %}
