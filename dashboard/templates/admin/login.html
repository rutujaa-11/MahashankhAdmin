<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Mahashankh Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f17 !important;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }

        .login-card {
            width: 380px;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #6b7280;
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            height: 44px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 0 14px 0 40px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: #4f46e5;
            background-color: #111827;
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            background-color: #4f46e5;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .btn-submit:hover {
            background-color: #4338ca;
        }

        .error-msg {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-size: 12px;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="brand-icon"><i class="fa-solid fa-cubes"></i></div>
        <div class="brand-text">
            <span class="brand-title">Mahashankh Wallpapers</span>
            <span class="brand-subtitle">Admin Panel</span>
        </div>
    </div>

    <div class="login-card">
        <h2 class="card-title">Sign In</h2>
        <p class="card-desc">Enter your admin credentials to access the dashboard</p>

        {% if form.errors %}
        <div class="error-msg">Invalid Username or Password</div>
        {% endif %}

        <form action="{{ app_path }}" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="id_username" name="username" placeholder="Enter your username" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="id_password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>
    </div>

</body>
</html>
